<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGee Creek Report — Nick Anderson</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .project-detail-header {
            padding: 0.5rem 1.5rem;
            border-bottom: 1px solid #000;
            margin-bottom: 0;
        }
        .project-detail-header h1 { font-size: 1.1em; font-weight: normal; }
        .pdf-container {
            width: 100%;
            height: calc(100vh - 50px);
            padding: 0;
        }
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <main class="main-content" style="margin-right: 0; max-width: 100%;">
            <div class="project-detail-header">
                <h1>MCGEE CREEK FIELD REPORT</h1>
            </div>
            <div class="pdf-container">
                <iframe src="McGee_Creek_Report.pdf"></iframe>
            </div>
        </main>
    </div>
</body>
</html>
