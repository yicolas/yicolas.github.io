<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni Carpool</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1c2333; --muted:#6b7488;
    --line:#e4e8f0; --brand:#3b6cf5; --brand-ink:#ffffff;
    --open:#eef4ff; --pool:#fff7ed; --chip:#eef1f8; --wd:#0d8f6f; --wd-bg:#e2f6ef;
    --room:#f3edff; --room-ink:#6b46c1;
    --shadow:0 1px 3px rgba(20,30,60,.08),0 6px 18px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1320; --panel:#171d2e; --ink:#e8ecf6; --muted:#9aa4bd; --line:#28304a;
    --brand:#5b86ff; --open:#16233f; --pool:#2a2113; --chip:#232b42; --wd:#3fd3a8; --wd-bg:#123328;
    --room:#241a3d; --room-ink:#b79cff;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}}
  :root[data-theme="dark"]{
    --bg:#0f1320; --panel:#171d2e; --ink:#e8ecf6; --muted:#9aa4bd; --line:#28304a;
    --brand:#5b86ff; --open:#16233f; --pool:#2a2113; --chip:#232b42; --wd:#3fd3a8; --wd-bg:#123328;
    --room:#241a3d; --room-ink:#b79cff;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;width:100%}
  /* ---- chat left column ---- */
  .chat-col{width:300px;flex:none;height:100vh;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
  .chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
  .chat-head strong{font-size:1rem}
  .chat-who{font-size:.72rem;color:var(--muted)}
  .chat-head .grow{flex:1}
  .chat-banner{font-size:.72rem;padding:6px 12px;background:var(--pool);color:#7a5a1f;border-bottom:1px solid var(--line);flex:none}
  .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .msg{max-width:90%;padding:7px 10px;border-radius:12px;background:var(--chip);align-self:flex-start}
  .msg.me{align-self:flex-end;background:var(--brand);color:#fff}
  .msg .who{font-size:.68rem;font-weight:700;opacity:.8;margin-bottom:1px}
  .msg .txt{font-size:.86rem;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .msg .t{font-size:.6rem;opacity:.6;margin-top:2px;text-align:right}
  .chat-empty{color:var(--muted);font-size:.82rem;text-align:center;margin:auto}
  .chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);flex:none}
  .chat-form input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  /* ---- main column ---- */
  .main-col{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 16px;flex:none}
  h1{font-size:1.2rem;margin:0;letter-spacing:-.01em}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;box-shadow:var(--shadow);display:flex;align-items:baseline;gap:5px}
  .stat .n{font-size:1.05rem;font-weight:700}
  .stat .l{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .grow{flex:1}
  .bar{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px;flex:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 11px;transition:.12s;box-shadow:var(--shadow)}
  button:hover{transform:translateY(-1px)} button:active{transform:translateY(0)}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button.ghost{box-shadow:none;background:transparent}
  button.sm{padding:3px 8px;font-size:.8rem;border-radius:8px;box-shadow:none}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  /* ---- content grid ---- */
  .content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,1.5fr) minmax(210px,.9fr) minmax(240px,1.1fr);gap:12px;padding:0 16px 14px}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .col-head{flex:none;display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-weight:600}
  .col-head .badge{background:var(--brand);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px}
  .col-body{flex:1;overflow-y:auto;padding:11px;min-height:0}
  .cars{display:flex;flex-direction:column;gap:11px}
  .car{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .car.dragover,.col.dragover{outline:2px dashed var(--brand);outline-offset:-3px}
  .car h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:7px}
  .car .from{color:var(--muted);font-size:.8rem}
  .car .note{font-size:.78rem;background:var(--chip);border-radius:8px;padding:5px 8px;color:var(--muted)}
  .wd-badge{display:inline-flex;align-items:center;gap:3px;background:var(--wd-bg);color:var(--wd);font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px}
  .seats-row{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
  .seatbtn{width:24px;height:24px;padding:0;border-radius:7px;font-weight:700;line-height:1}
  .cap{margin-left:auto;font-weight:600;color:var(--ink)}
  .slots{display:flex;flex-direction:column;gap:5px;min-height:16px}
  .full-flag{color:var(--wd);font-weight:600;font-size:.78rem}
  .chip{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:6px 8px;cursor:grab;user-select:none}
  .chip.selected{outline:2px solid var(--brand);outline-offset:1px}
  .chip .nm{font-weight:600;font-size:.85rem}
  .chip .meta{font-size:.7rem;color:var(--muted)}
  .chip .col2{display:flex;flex-direction:column;min-width:0;flex:1}
  .chip .meta,.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .x{color:#e0524a;font-weight:700;padding:0 3px;border:none;background:none;box-shadow:none;cursor:pointer}
  .empty-slot{border:1px dashed var(--line);border-radius:9px;padding:6px 8px;color:var(--muted);font-size:.78rem;text-align:center}
  .room-sub{margin-bottom:12px}
  .room-sub h4{margin:0 0 6px;font-size:.85rem;display:flex;align-items:center;gap:6px}
  .room-sub .tag{font-size:.64rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--room);color:var(--room-ink)}
  .room-list{display:flex;flex-direction:column;gap:5px}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
  .modal-bg.on{display:flex}
  .modal{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 12px}
  .modal label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 3px}
  .modal input[type=text],.modal input[type=number],.modal textarea,.modal select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .modal .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:var(--ink)}
  .modal .check input,.modal .radio input{width:18px;height:18px}
  .modal .radio{display:flex;gap:16px;margin-top:4px}
  .modal .radio label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:.9rem}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .loglist{max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px}
  .logrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .logrow:hover{background:var(--chip)} .logrow.cur{background:var(--open);font-weight:600}
  .logdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .logrow.cur .logdot{background:var(--brand)}
  .loglabel{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logtime{font-size:.72rem;color:var(--muted)}
  .flash{animation:flash .6s ease}@keyframes flash{0%{background:var(--brand);color:#fff}100%{}}
  /* mobile: allow scroll, stack */
  @media (max-width:900px){
    body{overflow:auto}
    .app{flex-direction:column;height:auto}
    .chat-col{width:auto;height:auto;max-height:60vh;border-right:none;border-bottom:1px solid var(--line)}
    .chat-msgs{max-height:34vh}
    .main-col{height:auto}
    .content{grid-template-columns:1fr}
    .col{max-height:none}
    .col-body{overflow:visible}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Chat (left) -->
  <aside class="chat-col">
    <div class="chat-head">
      <strong>💬 Group chat</strong>
      <span class="grow"></span>
      <span class="chat-who" id="chatWho"></span>
      <button class="ghost sm" id="chatName" title="Set / change your name">✎</button>
    </div>
    <div class="chat-banner" id="chatBanner"></div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <form class="chat-form" id="chatForm">
      <input id="chatInput" placeholder="Message the group…" autocomplete="off" maxlength="500">
      <button class="primary" type="submit">Send</button>
    </form>
  </aside>

  <!-- Main -->
  <div class="main-col">
    <div class="topbar">
      <h1>🚗 Alumni Carpool</h1>
      <div class="stats" id="stats"></div>
      <span class="grow"></span>
      <button class="ghost sm" id="themeBtn" title="Toggle light/dark">◐ Theme</button>
    </div>
    <div class="bar">
      <button class="primary" id="randomBtn">🎲 Randomly assign</button>
      <button id="addCarBtn">＋ Host a car</button>
      <button id="addRiderBtn">＋ Add a person</button>
      <button id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
      <button id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
      <span class="grow"></span>
      <button class="ghost sm" id="logBtn" title="Change log">🕘 Log</button>
      <button class="ghost sm" id="clearBtn">Clear seats</button>
      <button class="ghost sm" id="exportBtn">⭳ Export</button>
      <button class="ghost sm" id="importBtn">⭱ Import</button>
      <button class="ghost sm" id="resetBtn">↺ Reset</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>

    <div class="content">
      <section class="col" id="carsCol">
        <div class="col-head">🚙 Cars &amp; drivers <span class="badge" id="carCount">0</span></div>
        <div class="col-body"><div class="cars" id="cars"></div></div>
      </section>

      <section class="col" id="pool">
        <div class="col-head">🧍 Needs a ride <span class="badge" id="poolCount">0</span></div>
        <div class="col-body"><div class="slots" id="poolSlots"></div></div>
      </section>

      <section class="col" id="roomsCol">
        <div class="col-head">🛏️ Room sharing
          <span class="grow"></span>
          <button class="sm primary" id="addRoomBtn">＋ Add me</button>
        </div>
        <div class="col-body">
          <div class="room-sub">
            <h4>Offering a room <span class="tag" id="offerCount">0</span></h4>
            <div class="room-list" id="offerList"></div>
          </div>
          <div class="room-sub">
            <h4>Looking for a room <span class="tag" id="lookCount">0</span></h4>
            <div class="room-list" id="lookList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const KEY="carpoolBoard.v1", CHAT_KEY="carpoolChat.v1", HKEY="carpoolHist.v1";

function seedData(){
  return {
    cars:[
      {id:"c1",driver:"Carl Swindle",from:"Pasadena, CA",seats:2,note:"",fourwd:false},
      {id:"c2",driver:"Paul Edward Filmer",from:"Pasadena, Caltech or Old Town",seats:3,note:"Will coordinate as needed",fourwd:false},
      {id:"c3",driver:"Ray J. Weldon II",from:"Eugene, OR → Pasadena for the meeting, then return to Eugene, OR",seats:3,note:"",fourwd:false},
      {id:"c4",driver:"Stephen John Kirschvink",from:"San Diego, CA",seats:3,note:"",fourwd:false},
      {id:"c5",driver:"Jonathan Irving Lunine",from:"Pasadena",seats:3,note:"",fourwd:false},
      {id:"c6",driver:"Paul Asimow",from:"Pasadena",seats:3,note:"Will take whoever needs a space",fourwd:false},
      {id:"c7",driver:"David Paige",from:"Los Angeles",seats:4,note:"Silverado 4WD pickup truck",fourwd:true},
      {id:"c8",driver:"Lydia Kivrak",from:"",seats:4,note:"",fourwd:false},
      {id:"c9",driver:"Mehul Jangir",from:"Pasadena/San Marino",seats:4,note:"Can drive, but also happy to ride with someone else instead",fourwd:false}
    ],
    riders:[
      {id:"r1",name:"Michael Roy Nelson",from:"",note:"",carId:"c2"},
      {id:"r2",name:"Daniel Zhou",from:"",note:"",carId:"c6"},
      {id:"r3",name:"Martha Moran",from:"Shoshone",note:"Please check if Steve Kirschvink is attending and bringing his 4Runner",carId:null},
      {id:"r4",name:"Theodore M Present",from:"Palms, Los Angeles (can come to campus)",note:"",carId:null},
      {id:"r5",name:"David Evans",from:"Pasadena",note:"No preference — please assign me",carId:null},
      {id:"r6",name:"Sunghwan Im",from:"Pasadena",note:"",carId:null},
      {id:"r7",name:"Ren Thomas C. Marquez",from:"Pasadena",note:"No preference — please assign me",carId:null},
      {id:"r8",name:"Paul Macdonald Magyar",from:"Pasadena",note:"",carId:null},
      {id:"r9",name:"Kabir Mohammed",from:"",note:"",carId:null},
      {id:"r10",name:"Rebecca Jiron",from:"Pasadena",note:"",carId:null},
      {id:"r11",name:"Lily Elizabeth Coffin",from:"",note:"No preference — please assign me",carId:null},
      {id:"r12",name:"Weng Ki Ching",from:"Pasadena, Caltech",note:"No preference — please assign me",carId:null},
      {id:"r13",name:"Michelle Dan",from:"Venice, CA",note:"Would like to ride with Alice Michel & Ricky Wedeen",carId:null},
      {id:"r14",name:"Alice Michel",from:"",note:"Same car as Michelle Dan if possible",carId:null},
      {id:"r15",name:"Matteo Herbert Kimura",from:"",note:"",carId:null},
      {id:"r16",name:"Matthew Ross Diamond",from:"Pasadena",note:"No preference — please assign me",carId:null}
    ],
    rooms:{offering:[],looking:[]}
  };
}
function ensureShape(s){ if(!s.rooms)s.rooms={offering:[],looking:[]}; if(!s.rooms.offering)s.rooms.offering=[]; if(!s.rooms.looking)s.rooms.looking=[]; return s; }

let seq=100;
let state = ensureShape(loadLocal());
function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.cars&&s.riders) return s; }catch(e){} return seedData(); }
let suppressSave=false;
function persist(){ if(suppressSave)return; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const carById=id=>state.cars.find(c=>c.id===id);
const ridersIn=id=>state.riders.filter(r=>r.carId===id);
const openSeats=c=>Math.max(0,c.seats-ridersIn(c.id).length);
const unassigned=()=>state.riders.filter(r=>!r.carId);
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function attendeeNames(){
  const set=[]; state.cars.forEach(c=>{if(c.driver&&set.indexOf(c.driver)<0)set.push(c.driver);});
  state.riders.forEach(r=>{if(r.name&&set.indexOf(r.name)<0)set.push(r.name);});
  return set.sort((a,b)=>a.localeCompare(b));
}

/* ---------- render ---------- */
function render(){ ensureShape(state); renderStats(); renderCars(); renderPool(); renderRooms(); persist(); }
function renderStats(){
  const totalSeats=state.cars.reduce((s,c)=>s+c.seats,0);
  const filled=state.riders.filter(r=>r.carId).length;
  const cards=[["Cars",state.cars.length],["Seats",totalSeats],["Filled",filled],["Need ride",unassigned().length],["Rooms offered",state.rooms.offering.length]];
  document.getElementById("stats").innerHTML=cards.map(([l,n])=>`<div class="stat"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("");
}
function riderChip(r,{removable}={}){
  const meta=[r.from,r.note].filter(Boolean).map(esc).join(" · ");
  return `<div class="chip" draggable="true" data-rid="${r.id}"><span>👤</span>
    <div class="col2"><span class="nm">${esc(r.name)}</span>${meta?`<span class="meta" title="${meta}">${meta}</span>`:""}</div>
    ${removable?`<button class="x" data-remove="${r.id}" title="Remove from car">✕</button>`:""}</div>`;
}
function renderCars(){
  document.getElementById("carCount").textContent=state.cars.length;
  document.getElementById("cars").innerHTML=state.cars.map(c=>{
    const rs=ridersIn(c.id),open=openSeats(c);
    const slots=rs.map(r=>riderChip(r,{removable:true})).join("")+Array.from({length:open}).map(()=>`<div class="empty-slot">open seat</div>`).join("");
    return `<section class="car" data-cid="${c.id}">
      <h3>🚙 ${esc(c.driver)||"(driver)"} ${c.fourwd?`<span class="wd-badge" title="Has 4-wheel drive">⛰ 4WD</span>`:""}
        <span class="grow"></span>
        <button class="ghost sm" data-editcar="${c.id}" title="Edit">✎</button>
        <button class="ghost sm" data-delcar="${c.id}" title="Delete">🗑</button></h3>
      ${c.from?`<div class="from">📍 ${esc(c.from)}</div>`:""}
      ${c.note?`<div class="note">${esc(c.note)}</div>`:""}
      <div class="seats-row">
        <button class="seatbtn" data-seat="-1" data-cid="${c.id}">−</button><span>${c.seats} seats</span>
        <button class="seatbtn" data-seat="1" data-cid="${c.id}">+</button>
        <span class="cap">${open>0?`${open} open`:`<span class="full-flag">full ✓</span>`}</span></div>
      <div class="slots">${slots||`<div class="empty-slot">no seats</div>`}</div></section>`;
  }).join("");
}
function renderPool(){
  const u=unassigned();
  document.getElementById("poolCount").textContent=u.length;
  document.getElementById("poolSlots").innerHTML=u.length?u.map(r=>riderChip(r)).join(""):`<div class="empty-slot">Everyone has a seat 🎉</div>`;
}
function roomChip(e,list){
  return `<div class="chip"><span>🛏️</span><div class="col2"><span class="nm">${esc(e.name)}</span>${e.note?`<span class="meta" title="${esc(e.note)}">${esc(e.note)}</span>`:""}</div>
    <button class="x" data-roomdel="${list}:${e.id}" title="Remove">✕</button></div>`;
}
function renderRooms(){
  const off=state.rooms.offering,look=state.rooms.looking;
  document.getElementById("offerCount").textContent=off.length;
  document.getElementById("lookCount").textContent=look.length;
  document.getElementById("offerList").innerHTML=off.length?off.map(e=>roomChip(e,"offering")).join(""):`<div class="empty-slot">No one yet</div>`;
  document.getElementById("lookList").innerHTML=look.length?look.map(e=>roomChip(e,"looking")).join(""):`<div class="empty-slot">No one yet</div>`;
}

/* ---------- history ---------- */
let history=[],hi=-1;
function cloneState(s){return JSON.parse(JSON.stringify(s));}
function initHistory(){
  try{ const h=JSON.parse(localStorage.getItem(HKEY));
    if(h&&h.stack&&h.stack.length){ history=h.stack; hi=Math.min(h.hi,history.length-1); state=ensureShape(cloneState(history[hi].state)); return; }
  }catch(e){}
  history=[{state:cloneState(state),label:"Loaded board",ts:Date.now()}]; hi=0;
}
function saveHistory(){ try{ localStorage.setItem(HKEY,JSON.stringify({stack:history,hi:hi})); }catch(e){} }
function pushHistory(label){
  history=history.slice(0,hi+1);
  history.push({state:cloneState(state),label:label||"Change",ts:Date.now()});
  while(history.length>120)history.shift();
  hi=history.length-1; saveHistory(); updateHistUI(); renderLog();
}
function commit(label){ render(); pushHistory(label); }
function goTo(i,verb){ if(i<0||i>=history.length)return; hi=i; state=ensureShape(cloneState(history[hi].state)); render(); saveHistory(); updateHistUI(); renderLog(); if(verb)toast(verb); }
function undo(){ if(hi>0){const l=history[hi].label; goTo(hi-1,"Undid: "+l);} else toast("Nothing to undo"); }
function redo(){ if(hi<history.length-1){const l=history[hi+1].label; goTo(hi+1,"Redid: "+l);} else toast("Nothing to redo"); }
function updateHistUI(){ const u=document.getElementById("undoBtn"),r=document.getElementById("redoBtn"); if(u)u.disabled=hi<=0; if(r)r.disabled=hi>=history.length-1; }
function logRows(){ return history.map((h,i)=>`<div class="logrow ${i===hi?'cur':''}" data-jump="${i}"><span class="logdot"></span><span class="loglabel">${esc(h.label)}${i===hi?' (current)':''}</span><span class="logtime">${fmtTime(h.ts)}</span></div>`).reverse().join(""); }
function logModal(){ document.getElementById("modal").innerHTML=`<h3>Change log</h3><div style="font-size:.8rem;color:var(--muted);margin-bottom:8px">Newest first. Click any point to jump the board there; ↶ / ↷ step through this list.</div><div id="logList" class="loglist">${logRows()}</div><div class="row"><button class="ghost" onclick="_closeModal()">Close</button></div>`; modalBg.classList.add("on"); }
function renderLog(){ const l=document.getElementById("logList"); if(l)l.innerHTML=logRows(); }

/* ---------- moving riders ---------- */
function moveRider(rid,carId){
  const r=state.riders.find(x=>x.id===rid); if(!r)return;
  if(carId){ const c=carById(carId); if(!c)return; if(r.carId!==carId&&openSeats(c)<=0){toast(`${c.driver}'s car is full`);return;} }
  r.carId=carId||null; selectedRider=null;
  const dest=carId?carById(carId):null;
  commit("Moved "+r.name+" → "+(dest?dest.driver:"Needs a ride"));
}
let selectedRider=null;

/* ---------- random ---------- */
function randomAssign(){
  const pool=shuffle(unassigned().slice()); let progress=true;
  while(pool.length&&progress){ progress=false;
    for(const c of shuffle(state.cars.slice())){ if(!pool.length)break; if(openSeats(c)>0){pool.shift().carId=c.id;progress=true;} } }
  commit("Randomly assigned everyone");
  const b=document.getElementById("randomBtn");b.classList.add("flash");setTimeout(()=>b.classList.remove("flash"),600);
  if(pool.length)toast(`${pool.length} still need a seat — not enough open seats`);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.9rem;transition:opacity .3s";document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity="0",2200);
}

/* ---------- modals ---------- */
const modalBg=document.getElementById("modalBg");
function closeModal(){modalBg.classList.remove("on");document.getElementById("modal").innerHTML="";}
modalBg.addEventListener("click",e=>{if(e.target===modalBg)closeModal();});
window._closeModal=closeModal;

function carModal(car){
  const editing=!!car; car=car||{driver:"",from:"",seats:4,note:"",fourwd:false};
  document.getElementById("modal").innerHTML=`<h3>${editing?"Edit car":"Host a car"}</h3>
    <label>Driver name</label><input type="text" id="m_driver" value="${esc(car.driver)}">
    <label>Departing from</label><input type="text" id="m_from" value="${esc(car.from)}">
    <label>Number of seats (passengers)</label><input type="number" id="m_seats" min="0" max="12" value="${car.seats}">
    <label class="check"><input type="checkbox" id="m_4wd" ${car.fourwd?"checked":""}> This car has 4-wheel drive (4WD)</label>
    <label>Notes (optional)</label><textarea id="m_note" rows="2">${esc(car.note)}</textarea>
    <div class="row"><button class="ghost" onclick="_closeModal()">Cancel</button><button class="primary" id="m_save">${editing?"Save":"Add car"}</button></div>`;
  modalBg.classList.add("on");
  document.getElementById("m_save").onclick=()=>{
    const driver=document.getElementById("m_driver").value.trim();
    const seats=Math.max(0,parseInt(document.getElementById("m_seats").value,10)||0);
    const fourwd=document.getElementById("m_4wd").checked;
    if(!driver){toast("Enter a driver name");return;}
    if(editing){ const filled=ridersIn(car.id).length; if(seats<filled){toast(`That car already has ${filled} riders`);return;}
      car.driver=driver;car.from=document.getElementById("m_from").value.trim();car.seats=seats;car.note=document.getElementById("m_note").value.trim();car.fourwd=fourwd;
    } else { state.cars.push({id:"c"+(seq++),driver,from:document.getElementById("m_from").value.trim(),seats,note:document.getElementById("m_note").value.trim(),fourwd}); }
    closeModal(); commit((editing?"Edited car: ":"Added car: ")+driver);
  };
}
function riderModal(){
  document.getElementById("modal").innerHTML=`<h3>Add a person (needs a ride)</h3>
    <label>Name</label><input type="text" id="m_name" value="">
    <label>Coming from (optional)</label><input type="text" id="m_rfrom" value="">
    <label>Notes / preferences (optional)</label><textarea id="m_rnote" rows="2"></textarea>
    <div class="row"><button class="ghost" onclick="_closeModal()">Cancel</button><button class="primary" id="m_radd">Add</button></div>`;
  modalBg.classList.add("on");
  document.getElementById("m_radd").onclick=()=>{
    const name=document.getElementById("m_name").value.trim(); if(!name){toast("Enter a name");return;}
    state.riders.push({id:"r"+(seq++),name,from:document.getElementById("m_rfrom").value.trim(),note:document.getElementById("m_rnote").value.trim(),carId:null});
    closeModal(); commit("Added person: "+name);
  };
}
function roomModal(){
  const opts=attendeeNames().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  document.getElementById("modal").innerHTML=`<h3>Room sharing — add yourself</h3>
    <label>Your name</label>
    <select id="rm_name"><option value="">— pick from the list —</option>${opts}<option value="__other">Someone not listed…</option></select>
    <input type="text" id="rm_other" placeholder="Type name" style="display:none;margin-top:6px">
    <label>Which list?</label>
    <div class="radio">
      <label><input type="radio" name="rm_list" value="looking" checked> Looking for a room</label>
      <label><input type="radio" name="rm_list" value="offering"> Offering a room</label>
    </div>
    <label>Notes (hotel, nights, budget, roommates…) — optional</label><textarea id="rm_note" rows="2"></textarea>
    <div class="row"><button class="ghost" onclick="_closeModal()">Cancel</button><button class="primary" id="rm_add">Add me</button></div>`;
  modalBg.classList.add("on");
  const sel=document.getElementById("rm_name"), other=document.getElementById("rm_other");
  sel.onchange=()=>{ other.style.display = sel.value==="__other"?"block":"none"; };
  document.getElementById("rm_add").onclick=()=>{
    let name=sel.value==="__other"?other.value.trim():sel.value;
    if(!name){toast("Pick or type your name");return;}
    const list=document.querySelector('input[name="rm_list"]:checked').value;
    const note=document.getElementById("rm_note").value.trim();
    state.rooms[list].push({id:"rm"+(seq++),name,note});
    closeModal(); commit((list==="offering"?"Offering a room: ":"Looking for a room: ")+name);
  };
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const jr=t.closest&&t.closest("[data-jump]"); if(jr){goTo(parseInt(jr.dataset.jump,10));return;}
  if(t.dataset.roomdel){ const [list,id]=t.dataset.roomdel.split(":"); const arr=state.rooms[list]; const idx=arr.findIndex(x=>x.id===id);
    if(idx>=0){ const nm=arr[idx].name; arr.splice(idx,1); commit("Removed from "+(list==="offering"?"offering":"looking")+": "+nm);} return; }
  if(t.dataset.remove){moveRider(t.dataset.remove,null);return;}
  if(t.dataset.seat){ const c=carById(t.dataset.cid),d=parseInt(t.dataset.seat,10),filled=ridersIn(c.id).length,next=c.seats+d;
    if(next<filled){toast(`Already ${filled} riders in this car`);return;} if(next<0)return; c.seats=next; commit((d>0?"Added a seat to ":"Removed a seat from ")+c.driver); return; }
  if(t.dataset.editcar){carModal(carById(t.dataset.editcar));return;}
  if(t.dataset.delcar){const c=carById(t.dataset.delcar);const dn=c.driver;ridersIn(c.id).forEach(r=>r.carId=null);state.cars=state.cars.filter(x=>x.id!==c.id);commit("Removed car: "+dn);return;}
  const chip=t.closest(".chip");
  if(chip&&chip.dataset.rid){const rid=chip.dataset.rid;selectedRider=selectedRider===rid?null:rid;
    document.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("selected",ch.dataset.rid===selectedRider));return;}
  if(selectedRider){const car=t.closest(".car"); if(car){moveRider(selectedRider,car.dataset.cid);return;} if(t.closest("#pool")){moveRider(selectedRider,null);return;}}
});
document.addEventListener("dragstart",e=>{const chip=e.target.closest(".chip");if(chip&&chip.dataset.rid){e.dataTransfer.setData("text/plain",chip.dataset.rid);e.dataTransfer.effectAllowed="move";}});
document.addEventListener("dragover",e=>{const z=e.target.closest(".car")||e.target.closest("#pool");if(z){e.preventDefault();z.classList.add("dragover");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest(".car")||e.target.closest("#pool");if(z)z.classList.remove("dragover");});
document.addEventListener("drop",e=>{const carZone=e.target.closest(".car"),poolZone=e.target.closest("#pool");if(!carZone&&!poolZone)return;e.preventDefault();
  document.querySelectorAll(".dragover").forEach(z=>z.classList.remove("dragover"));
  const rid=e.dataTransfer.getData("text/plain");if(rid)moveRider(rid,carZone?carZone.dataset.cid:null);});

/* toolbar */
document.getElementById("randomBtn").onclick=randomAssign;
document.getElementById("addCarBtn").onclick=()=>carModal(null);
document.getElementById("addRiderBtn").onclick=riderModal;
document.getElementById("addRoomBtn").onclick=roomModal;
document.getElementById("undoBtn").onclick=undo;
document.getElementById("redoBtn").onclick=redo;
document.getElementById("logBtn").onclick=logModal;
document.getElementById("clearBtn").onclick=()=>{if(confirm("Send everyone back to the 'needs a ride' pool?")){state.riders.forEach(r=>r.carId=null);commit("Cleared all seats");}};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset the board to the original sign-up data? This clears changes.")){state=seedData();commit("Reset to form data");}};
document.getElementById("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="carpool-assignments.json";a.click();URL.revokeObjectURL(a.href);};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const s=JSON.parse(rd.result);if(s.cars&&s.riders){state=ensureShape(s);commit("Imported a board file");toast("Imported ✓");}else toast("Not a valid board file");}catch(err){toast("Could not read that file");}};
  rd.readAsText(f);e.target.value="";};
document.addEventListener("keydown",e=>{
  if(/^(input|textarea|select)$/i.test(e.target.tagName||""))return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=(e.key||"").toLowerCase();
    if(k==="z"&&!e.shiftKey){e.preventDefault();undo();}else if((k==="z"&&e.shiftKey)||k==="y"){e.preventDefault();redo();}}
});

/* theme */
document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("carpoolTheme",next);}catch(e){}};
try{const th=localStorage.getItem("carpoolTheme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}

/* chat (docked left, local-only) */
let localChat=[];
function myName(){ let n=null; try{n=localStorage.getItem("carpoolChatName");}catch(e){} if(!n){n=(prompt("Your name for the chat:")||"Anonymous").trim()||"Anonymous";try{localStorage.setItem("carpoolChatName",n);}catch(e){}} return n; }
function setWho(){ let n="?"; try{n=localStorage.getItem("carpoolChatName")||"not set";}catch(e){} document.getElementById("chatWho").textContent="as "+n; }
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
function renderMsg(m){
  const box=document.getElementById("chatMsgs"); const empty=box.querySelector(".chat-empty"); if(empty)empty.remove();
  let me=false; try{me=(m.name===localStorage.getItem("carpoolChatName"));}catch(e){}
  const el=document.createElement("div"); el.className="msg"+(me?" me":"");
  el.innerHTML=`<div class="who">${esc(m.name)}</div><div class="txt">${esc(m.text)}</div><div class="t">${fmtTime(m.ts)}</div>`;
  box.appendChild(el); box.scrollTop=box.scrollHeight;
}
function sendChat(text){ const m={name:myName(),text:text,ts:Date.now()}; localChat.push(m); try{localStorage.setItem(CHAT_KEY,JSON.stringify(localChat));}catch(e){} renderMsg(m); }
function initLocalChat(){
  try{localChat=JSON.parse(localStorage.getItem(CHAT_KEY))||[];}catch(e){localChat=[];}
  const box=document.getElementById("chatMsgs"); box.innerHTML="";
  if(localChat.length)localChat.forEach(renderMsg); else box.innerHTML=`<div class="chat-empty">No messages yet.</div>`;
  document.getElementById("chatBanner").textContent="Messages are saved on this device only.";
}
document.getElementById("chatName").onclick=()=>{ const cur=(function(){try{return localStorage.getItem("carpoolChatName")||"";}catch(e){return "";}})(); const n=(prompt("Your name for the chat:",cur)||"").trim(); if(n){try{localStorage.setItem("carpoolChatName",n);}catch(e){} setWho();} };
document.getElementById("chatForm").addEventListener("submit",e=>{e.preventDefault();const inp=document.getElementById("chatInput");const v=inp.value.trim();if(!v)return;sendChat(v);inp.value="";setWho();});

/* boot */
initHistory();
render();
updateHistUI();
initLocalChat();
setWho();
</script>
</body>
</html>
