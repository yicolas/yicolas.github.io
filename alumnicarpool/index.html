<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni Carpool</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1c2333; --muted:#6b7488;
    --line:#e4e8f0; --brand:#3b6cf5; --brand-ink:#ffffff;
    --open:#eef4ff; --open-line:#c9dcff; --pool:#fff7ed; --pool-line:#f4d9b0;
    --good:#1f9d55; --danger:#e0524a; --chip:#eef1f8; --wd:#0d8f6f; --wd-bg:#e2f6ef;
    --shadow:0 1px 3px rgba(20,30,60,.08),0 8px 24px rgba(20,30,60,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1320; --panel:#171d2e; --ink:#e8ecf6; --muted:#9aa4bd;
      --line:#28304a; --brand:#5b86ff; --open:#16233f; --open-line:#284372;
      --pool:#2a2113; --pool-line:#5a4420; --chip:#232b42; --wd:#3fd3a8; --wd-bg:#123328;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
      --bg:#0f1320; --panel:#171d2e; --ink:#e8ecf6; --muted:#9aa4bd;
      --line:#28304a; --brand:#5b86ff; --open:#16233f; --open-line:#284372;
      --pool:#2a2113; --pool-line:#5a4420; --chip:#232b42; --wd:#3fd3a8; --wd-bg:#123328;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
  h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 16px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .n{font-size:1.5rem;font-weight:700}
  .stat .l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:10px;padding:8px 13px;transition:.12s;box-shadow:var(--shadow)}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  button.ghost{box-shadow:none;background:transparent}
  button.sm{padding:3px 8px;font-size:.8rem;border-radius:8px;box-shadow:none}
  .grow{flex:1}
  .board{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
  @media (max-width:820px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  .cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  section.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .car{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
  .car.dragover,.pool.dragover{outline:2px dashed var(--brand);outline-offset:-4px;background:var(--open)}
  .car h3{margin:0;font-size:1.05rem;display:flex;align-items:center;gap:8px}
  .car .from{color:var(--muted);font-size:.82rem}
  .car .note{font-size:.8rem;background:var(--chip);border-radius:8px;padding:6px 8px;color:var(--muted)}
  .wd-badge{display:inline-flex;align-items:center;gap:3px;background:var(--wd-bg);color:var(--wd);
    font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
  .seats-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
  .seatbtn{width:26px;height:26px;padding:0;border-radius:8px;font-weight:700;line-height:1}
  .cap{margin-left:auto;font-weight:600;color:var(--ink)}
  .slots{display:flex;flex-direction:column;gap:6px;min-height:24px}
  .full-flag{color:var(--good);font-weight:600;font-size:.8rem}
  .chip{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);
    border-radius:10px;padding:7px 9px;cursor:grab;user-select:none}
  .chip.selected{outline:2px solid var(--brand);outline-offset:1px}
  .chip .nm{font-weight:600;font-size:.9rem}
  .chip .meta{font-size:.72rem;color:var(--muted)}
  .chip .col{display:flex;flex-direction:column;min-width:0;flex:1}
  .chip .meta,.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .x{color:var(--danger);font-weight:700;padding:0 4px;border:none;background:none;box-shadow:none;cursor:pointer}
  .empty-slot{border:1px dashed var(--line);border-radius:10px;padding:7px 9px;color:var(--muted);font-size:.8rem;text-align:center}
  .pool{padding:14px;position:sticky;top:12px}
  .pool h2{margin:0 0 4px;font-size:1.05rem}
  .pool .slots{gap:7px;margin-top:10px}
  .badge{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px;margin-left:6px}
  .hint{font-size:.78rem;color:var(--muted);margin-top:8px}
  footer{margin-top:26px;font-size:.8rem;color:var(--muted);text-align:center;line-height:1.6}
  .modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
  .modal-bg.on{display:flex}
  .modal{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 12px}
  .modal label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 3px}
  .modal input[type=text],.modal input[type=number],.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .modal .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:var(--ink)}
  .modal .check input{width:18px;height:18px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .flash{animation:flash .6s ease}
  @keyframes flash{0%{background:var(--brand);color:#fff}100%{}}
  .theme-toggle{margin-left:auto}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .loglist{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px}
  .logrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .logrow:hover{background:var(--chip)}
  .logrow.cur{background:var(--open);font-weight:600}
  .logdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .logrow.cur .logdot{background:var(--brand)}
  .loglabel{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logtime{font-size:.72rem;color:var(--muted)}
  /* chat */
  .chat-fab{position:fixed;right:20px;bottom:20px;z-index:60;border-radius:999px;padding:12px 16px;
    background:var(--brand);color:#fff;border:none;font-size:1rem;box-shadow:0 8px 24px rgba(20,30,60,.25)}
  .chat-fab .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--danger);border:2px solid var(--bg);display:none}
  .chat-fab.unread .dot{display:block}
  .chat-panel{position:fixed;right:20px;bottom:20px;z-index:70;width:340px;max-width:calc(100vw - 32px);
    height:460px;max-height:calc(100vh - 40px);background:var(--panel);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 12px 40px rgba(20,30,60,.28);display:none;flex-direction:column;overflow:hidden}
  .chat-panel.on{display:flex}
  .chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .chat-head strong{font-size:.98rem}
  .chat-who{font-size:.75rem;color:var(--muted);margin-left:2px}
  .chat-head .grow{flex:1}
  .chat-banner{font-size:.75rem;padding:7px 12px;background:var(--pool);color:#7a5a1f;border-bottom:1px solid var(--pool-line)}
  .chat-banner.ok{background:var(--wd-bg);color:var(--wd);border-color:transparent}
  .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:85%;padding:7px 10px;border-radius:12px;background:var(--chip);align-self:flex-start}
  .msg.me{align-self:flex-end;background:var(--brand);color:#fff}
  .msg .who{font-size:.7rem;font-weight:700;opacity:.8;margin-bottom:1px}
  .msg .txt{font-size:.88rem;white-space:pre-wrap;word-wrap:break-word}
  .msg .t{font-size:.62rem;opacity:.6;margin-top:2px;text-align:right}
  .chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
  .chat-form input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .chat-empty{color:var(--muted);font-size:.82rem;text-align:center;margin:auto}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🚗 Alumni Carpool</h1>
    <button class="ghost sm theme-toggle" id="themeBtn" title="Toggle light/dark">◐ Theme</button>
  </header>
  <p class="sub">Drag a person onto a car to give them a seat — or tap a person, then tap a car. <span id="modeNote"></span></p>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <button class="primary" id="randomBtn">🎲 Randomly assign everyone</button>
    <button id="addCarBtn">＋ Host a car</button>
    <button id="addRiderBtn">＋ Add a person</button>
    <button id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
    <span class="grow"></span>
    <button class="ghost sm" id="logBtn" title="View change log">🕘 Log</button>
    <button class="ghost sm" id="clearBtn">Clear all seats</button>
    <button class="ghost sm" id="exportBtn">⭳ Export</button>
    <button class="ghost sm" id="importBtn">⭱ Import</button>
    <button class="ghost sm" id="resetBtn">↺ Reset to form data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div class="board">
    <div class="cars" id="cars"></div>
    <section class="panel pool" id="pool">
      <h2>Needs a ride <span class="badge" id="poolCount">0</span></h2>
      <div class="hint">These people still need a seat. Drag them onto a car.</div>
      <div class="slots" id="poolSlots"></div>
    </section>
  </div>

  <footer id="footer"></footer>
</div>

<!-- Chat -->
<button class="chat-fab" id="chatFab" title="Group chat">💬 Chat<span class="dot"></span></button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <strong>Group chat</strong>
    <span class="chat-who" id="chatWho"></span>
    <span class="grow"></span>
    <button class="ghost sm" id="chatName" title="Change your name">✎</button>
    <button class="ghost sm" id="chatClose" title="Close">✕</button>
  </div>
  <div class="chat-banner" id="chatBanner"></div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <form class="chat-form" id="chatForm">
    <input id="chatInput" placeholder="Message the group…" autocomplete="off" maxlength="500">
    <button class="primary" type="submit">Send</button>
  </form>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
"use strict";

/* Local-only build (no backend). Everything saves in the visitor's own browser. */
const CLOUD = false;

const KEY = "carpoolBoard.v1";
const CHAT_KEY = "carpoolChat.v1";

/* ---------- seed data from the sign-up sheet ---------- */
function seedData(){
  return {
    cars:[
      {id:"c1",driver:"Carl Swindle",from:"Pasadena, CA",seats:2,note:"",fourwd:false},
      {id:"c2",driver:"Paul Edward Filmer",from:"Pasadena, Caltech or Old Town",seats:3,note:"Will coordinate as needed",fourwd:false},
      {id:"c3",driver:"Ray J. Weldon II",from:"Eugene, OR → Pasadena for the meeting, then return to Eugene, OR",seats:3,note:"",fourwd:false},
      {id:"c4",driver:"Stephen John Kirschvink",from:"San Diego, CA",seats:3,note:"",fourwd:false},
      {id:"c5",driver:"Jonathan Irving Lunine",from:"Pasadena",seats:3,note:"",fourwd:false},
      {id:"c6",driver:"Paul Asimow",from:"Pasadena",seats:3,note:"Will take whoever needs a space",fourwd:false},
      {id:"c7",driver:"David Paige",from:"Los Angeles",seats:4,note:"Silverado 4WD pickup truck",fourwd:true},
      {id:"c8",driver:"Lydia Kivrak",from:"",seats:4,note:"",fourwd:false},
      {id:"c9",driver:"Mehul Jangir",from:"Pasadena/San Marino",seats:4,note:"Can drive, but also happy to ride with someone else instead",fourwd:false}
    ],
    riders:[
      {id:"r1",name:"Michael Roy Nelson",from:"",note:"",carId:"c2"},
      {id:"r2",name:"Daniel Zhou",from:"",note:"",carId:"c6"},
      {id:"r3",name:"Martha Moran",from:"Shoshone",note:"Please check if Steve Kirschvink is attending and bringing his 4Runner",carId:null},
      {id:"r4",name:"Theodore M Present",from:"Palms, Los Angeles (can come to campus)",note:"",carId:null},
      {id:"r5",name:"David Evans",from:"Pasadena",note:"No preference — please assign me",carId:null},
      {id:"r6",name:"Sunghwan Im",from:"Pasadena",note:"",carId:null},
      {id:"r7",name:"Ren Thomas C. Marquez",from:"Pasadena",note:"No preference — please assign me",carId:null},
      {id:"r8",name:"Paul Macdonald Magyar",from:"Pasadena",note:"",carId:null},
      {id:"r9",name:"Kabir Mohammed",from:"",note:"",carId:null},
      {id:"r10",name:"Rebecca Jiron",from:"Pasadena",note:"",carId:null},
      {id:"r11",name:"Lily Elizabeth Coffin",from:"",note:"No preference — please assign me",carId:null},
      {id:"r12",name:"Weng Ki Ching",from:"Pasadena, Caltech",note:"No preference — please assign me",carId:null},
      {id:"r13",name:"Michelle Dan",from:"Venice, CA",note:"Would like to ride with Alice Michel & Ricky Wedeen",carId:null},
      {id:"r14",name:"Alice Michel",from:"",note:"Same car as Michelle Dan if possible",carId:null},
      {id:"r15",name:"Matteo Herbert Kimura",from:"",note:"",carId:null},
      {id:"r16",name:"Matthew Ross Diamond",from:"Pasadena",note:"No preference — please assign me",carId:null}
    ]
  };
}

/* ---------- state ---------- */
let db=null, boardRef=null, chatRef=null;
let connected=false, applyingRemote=false;
let selectedRider=null, seq=100;

let state = CLOUD ? seedData() : loadLocal();

function loadLocal(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.cars&&s.riders) return s; }catch(e){}
  return seedData();
}
function persist(){
  if(applyingRemote) return;
  if(CLOUD){ if(connected && boardRef){ try{ boardRef.set(state); }catch(e){} } }
  else { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
}

const carById = id => state.cars.find(c=>c.id===id);
const ridersIn = id => state.riders.filter(r=>r.carId===id);
const openSeats = c => Math.max(0, c.seats - ridersIn(c.id).length);
const unassigned = () => state.riders.filter(r=>!r.carId);
const esc = s => (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ---------- rendering ---------- */
function render(){
  renderStats(); renderCars(); renderPool(); persist();
}
function renderStats(){
  const totalSeats = state.cars.reduce((s,c)=>s+c.seats,0);
  const filled = state.riders.filter(r=>r.carId).length;
  const cards=[["Cars",state.cars.length],["Seats offered",totalSeats],["Seats filled",filled],["Still need a ride",unassigned().length]];
  document.getElementById("stats").innerHTML =
    cards.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}
function riderChip(r,{removable}={}){
  const meta=[r.from,r.note].filter(Boolean).map(esc).join(" · ");
  return `<div class="chip" draggable="true" data-rid="${r.id}"><span>👤</span>
    <div class="col"><span class="nm">${esc(r.name)}</span>${meta?`<span class="meta" title="${meta}">${meta}</span>`:""}</div>
    ${removable?`<button class="x" data-remove="${r.id}" title="Remove from car">✕</button>`:""}</div>`;
}
function renderCars(){
  document.getElementById("cars").innerHTML = state.cars.map(c=>{
    const rs=ridersIn(c.id), open=openSeats(c);
    const slots = rs.map(r=>riderChip(r,{removable:true})).join("")
      + Array.from({length:open}).map(()=>`<div class="empty-slot">open seat</div>`).join("");
    return `<section class="panel car" data-cid="${c.id}">
      <h3>🚙 ${esc(c.driver)||"(driver)"}
        ${c.fourwd?`<span class="wd-badge" title="Has 4-wheel drive">⛰ 4WD</span>`:""}
        <button class="ghost sm" data-editcar="${c.id}" title="Edit car" style="margin-left:auto">✎</button>
        <button class="ghost sm" data-delcar="${c.id}" title="Delete car">🗑</button></h3>
      ${c.from?`<div class="from">📍 ${esc(c.from)}</div>`:""}
      ${c.note?`<div class="note">${esc(c.note)}</div>`:""}
      <div class="seats-row">
        <button class="seatbtn" data-seat="-1" data-cid="${c.id}">−</button>
        <span>${c.seats} seats</span>
        <button class="seatbtn" data-seat="1" data-cid="${c.id}">+</button>
        <span class="cap">${open>0?`${open} open`:`<span class="full-flag">full ✓</span>`}</span>
      </div>
      <div class="slots">${slots||`<div class="empty-slot">no seats</div>`}</div>
    </section>`;
  }).join("");
}
function renderPool(){
  const u=unassigned();
  document.getElementById("poolCount").textContent=u.length;
  document.getElementById("poolSlots").innerHTML =
    u.length ? u.map(r=>riderChip(r)).join("") : `<div class="empty-slot">Everyone has a seat 🎉</div>`;
}

/* ---------- history: undo / redo / change log ---------- */
const HKEY="carpoolHist.v1";
let history=[], hi=-1;
function cloneState(s){return JSON.parse(JSON.stringify(s));}
function initHistory(){
  try{ const h=JSON.parse(localStorage.getItem(HKEY));
    if(h&&h.stack&&h.stack.length){ history=h.stack; hi=Math.min(h.hi,history.length-1); state=cloneState(history[hi].state); return; }
  }catch(e){}
  history=[{state:cloneState(state),label:"Loaded board",ts:Date.now()}]; hi=0;
}
function saveHistory(){ try{ localStorage.setItem(HKEY, JSON.stringify({stack:history,hi:hi})); }catch(e){} }
function pushHistory(label){
  history=history.slice(0,hi+1);
  history.push({state:cloneState(state),label:label||"Change",ts:Date.now()});
  while(history.length>120){ history.shift(); }
  hi=history.length-1; saveHistory(); updateHistUI(); renderLog();
}
function commit(label){ render(); pushHistory(label); }
function goTo(i,verb){
  if(i<0||i>=history.length) return;
  hi=i; state=cloneState(history[hi].state);
  render(); saveHistory(); updateHistUI(); renderLog(); if(verb) toast(verb);
}
function undo(){ if(hi>0){ const l=history[hi].label; goTo(hi-1,"Undid: "+l); } else toast("Nothing to undo"); }
function redo(){ if(hi<history.length-1){ const l=history[hi+1].label; goTo(hi+1,"Redid: "+l); } else toast("Nothing to redo"); }
function updateHistUI(){
  const u=document.getElementById("undoBtn"),r=document.getElementById("redoBtn");
  if(u)u.disabled=hi<=0; if(r)r.disabled=hi>=history.length-1;
}
function logRows(){
  return history.map((h,i)=>`<div class="logrow ${i===hi?'cur':''}" data-jump="${i}">
    <span class="logdot"></span><span class="loglabel">${esc(h.label)}${i===hi?' (current)':''}</span><span class="logtime">${fmtTime(h.ts)}</span></div>`).reverse().join("");
}
function logModal(){
  document.getElementById("modal").innerHTML=`<h3>Change log</h3>
    <div class="hint" style="margin-bottom:8px">Newest first. Click any point to jump the board to that state; the ↶ / ↷ buttons step through this list.</div>
    <div id="logList" class="loglist">${logRows()}</div>
    <div class="row"><button class="ghost" onclick="_closeModal()">Close</button></div>`;
  modalBg.classList.add("on");
}
function renderLog(){ const l=document.getElementById("logList"); if(l) l.innerHTML=logRows(); }

/* ---------- moving riders ---------- */
function moveRider(rid, carId){
  const r=state.riders.find(x=>x.id===rid); if(!r) return;
  if(carId){ const c=carById(carId); if(!c) return;
    if(r.carId!==carId && openSeats(c)<=0){ toast(`${c.driver}'s car is full`); return; } }
  r.carId=carId||null; selectedRider=null;
  const dest=carId?carById(carId):null;
  commit("Moved "+r.name+" → "+(dest?dest.driver:"Needs a ride"));
}

/* ---------- random assignment ---------- */
function randomAssign(){
  const pool=shuffle(unassigned().slice());
  let progress=true;
  while(pool.length&&progress){ progress=false;
    for(const c of shuffle(state.cars.slice())){ if(!pool.length)break;
      if(openSeats(c)>0){ pool.shift().carId=c.id; progress=true; } } }
  commit("Randomly assigned everyone");
  const b=document.getElementById("randomBtn"); b.classList.add("flash"); setTimeout(()=>b.classList.remove("flash"),600);
  if(pool.length) toast(`${pool.length} still need a seat — not enough open seats`);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.9rem;transition:opacity .3s";
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity="0",2200);
}

/* ---------- modal ---------- */
const modalBg=document.getElementById("modalBg");
function closeModal(){modalBg.classList.remove("on");document.getElementById("modal").innerHTML="";}
modalBg.addEventListener("click",e=>{if(e.target===modalBg)closeModal();});
window._closeModal=closeModal;

function carModal(car){
  const editing=!!car;
  car=car||{driver:"",from:"",seats:4,note:"",fourwd:false};
  document.getElementById("modal").innerHTML=`
    <h3>${editing?"Edit car":"Host a car"}</h3>
    <label>Driver name</label><input type="text" id="m_driver" value="${esc(car.driver)}">
    <label>Departing from</label><input type="text" id="m_from" value="${esc(car.from)}">
    <label>Number of seats (passengers)</label><input type="number" id="m_seats" min="0" max="12" value="${car.seats}">
    <label class="check"><input type="checkbox" id="m_4wd" ${car.fourwd?"checked":""}> This car has 4-wheel drive (4WD)</label>
    <label>Notes (optional)</label><textarea id="m_note" rows="2">${esc(car.note)}</textarea>
    <div class="row"><button class="ghost" onclick="_closeModal()">Cancel</button>
      <button class="primary" id="m_save">${editing?"Save":"Add car"}</button></div>`;
  modalBg.classList.add("on");
  document.getElementById("m_save").onclick=()=>{
    const driver=document.getElementById("m_driver").value.trim();
    const seats=Math.max(0,parseInt(document.getElementById("m_seats").value,10)||0);
    const fourwd=document.getElementById("m_4wd").checked;
    if(!driver){toast("Enter a driver name");return;}
    if(editing){
      const filled=ridersIn(car.id).length;
      if(seats<filled){toast(`That car already has ${filled} riders`);return;}
      car.driver=driver;car.from=document.getElementById("m_from").value.trim();
      car.seats=seats;car.note=document.getElementById("m_note").value.trim();car.fourwd=fourwd;
    } else {
      state.cars.push({id:"c"+(seq++),driver,from:document.getElementById("m_from").value.trim(),
        seats,note:document.getElementById("m_note").value.trim(),fourwd});
    }
    closeModal(); commit((editing?"Edited car: ":"Added car: ")+driver);
  };
}
function riderModal(){
  document.getElementById("modal").innerHTML=`
    <h3>Add a person (needs a ride)</h3>
    <label>Name</label><input type="text" id="m_name" value="">
    <label>Coming from (optional)</label><input type="text" id="m_rfrom" value="">
    <label>Notes / preferences (optional)</label><textarea id="m_rnote" rows="2"></textarea>
    <div class="row"><button class="ghost" onclick="_closeModal()">Cancel</button>
      <button class="primary" id="m_radd">Add</button></div>`;
  modalBg.classList.add("on");
  document.getElementById("m_radd").onclick=()=>{
    const name=document.getElementById("m_name").value.trim();
    if(!name){toast("Enter a name");return;}
    state.riders.push({id:"r"+(seq++),name,from:document.getElementById("m_rfrom").value.trim(),
      note:document.getElementById("m_rnote").value.trim(),carId:null});
    closeModal(); commit("Added person: "+name);
  };
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const jr=t.closest&&t.closest("[data-jump]"); if(jr){goTo(parseInt(jr.dataset.jump,10));return;}
  if(t.dataset.remove){moveRider(t.dataset.remove,null);return;}
  if(t.dataset.seat){
    const c=carById(t.dataset.cid),d=parseInt(t.dataset.seat,10),filled=ridersIn(c.id).length,next=c.seats+d;
    if(next<filled){toast(`Already ${filled} riders in this car`);return;}
    if(next<0)return; c.seats=next; commit((d>0?"Added a seat to ":"Removed a seat from ")+c.driver); return;
  }
  if(t.dataset.editcar){carModal(carById(t.dataset.editcar));return;}
  if(t.dataset.delcar){const c=carById(t.dataset.delcar);const dn=c.driver;ridersIn(c.id).forEach(r=>r.carId=null);
    state.cars=state.cars.filter(x=>x.id!==c.id);commit("Removed car: "+dn);return;}
  const chip=t.closest(".chip");
  if(chip){const rid=chip.dataset.rid;selectedRider=selectedRider===rid?null:rid;
    document.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("selected",ch.dataset.rid===selectedRider));return;}
  if(selectedRider){const car=t.closest(".car");
    if(car){moveRider(selectedRider,car.dataset.cid);return;}
    if(t.closest("#pool")){moveRider(selectedRider,null);return;}}
});
document.addEventListener("dragstart",e=>{const chip=e.target.closest(".chip");
  if(chip){e.dataTransfer.setData("text/plain",chip.dataset.rid);e.dataTransfer.effectAllowed="move";}});
document.addEventListener("dragover",e=>{const z=e.target.closest(".car")||e.target.closest("#pool");
  if(z){e.preventDefault();z.classList.add("dragover");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest(".car")||e.target.closest("#pool");if(z)z.classList.remove("dragover");});
document.addEventListener("drop",e=>{
  const carZone=e.target.closest(".car"),poolZone=e.target.closest("#pool");
  if(!carZone&&!poolZone)return; e.preventDefault();
  [...document.querySelectorAll(".car"),document.getElementById("pool")].forEach(z=>z&&z.classList.remove("dragover"));
  const rid=e.dataTransfer.getData("text/plain"); if(rid)moveRider(rid,carZone?carZone.dataset.cid:null);
});

/* toolbar */
document.getElementById("randomBtn").onclick=randomAssign;
document.getElementById("addCarBtn").onclick=()=>carModal(null);
document.getElementById("addRiderBtn").onclick=riderModal;
document.getElementById("undoBtn").onclick=undo;
document.getElementById("redoBtn").onclick=redo;
document.getElementById("logBtn").onclick=logModal;
document.addEventListener("keydown",e=>{
  if(/^(input|textarea)$/i.test(e.target.tagName||"")) return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=(e.key||"").toLowerCase();
    if(k==="z"&&!e.shiftKey){e.preventDefault();undo();}
    else if((k==="z"&&e.shiftKey)||k==="y"){e.preventDefault();redo();}
  }
});
document.getElementById("clearBtn").onclick=()=>{if(confirm("Send everyone back to the 'needs a ride' pool?")){state.riders.forEach(r=>r.carId=null);commit("Cleared all seats");}};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset the board to the original sign-up data? This clears changes for everyone.")){state=seedData();commit("Reset to form data");}};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="carpool-assignments.json";a.click();URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const s=JSON.parse(rd.result);if(s.cars&&s.riders){state=s;commit("Imported a board file");toast("Imported ✓");}else toast("Not a valid board file");}catch(err){toast("Could not read that file");}};
  rd.readAsText(f);e.target.value="";
};

/* theme */
const themeBtn=document.getElementById("themeBtn");
themeBtn.onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("carpoolTheme",next);}catch(e){}};
try{const th=localStorage.getItem("carpoolTheme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}

/* ============================================================
   CHAT
============================================================ */
let localChat=[];
function myName(){
  let n=null; try{n=localStorage.getItem("carpoolChatName");}catch(e){}
  if(!n){ n=(prompt("Your name for the chat:")||"Anonymous").trim()||"Anonymous"; try{localStorage.setItem("carpoolChatName",n);}catch(e){} }
  return n;
}
function setWho(){ document.getElementById("chatWho").textContent="as "+ (function(){try{return localStorage.getItem("carpoolChatName")||"?";}catch(e){return "?";}})(); }
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
function renderMsg(m){
  const box=document.getElementById("chatMsgs");
  const empty=box.querySelector(".chat-empty"); if(empty)empty.remove();
  let me=false; try{me=(m.name===localStorage.getItem("carpoolChatName"));}catch(e){}
  const el=document.createElement("div");
  el.className="msg"+(me?" me":"");
  el.innerHTML=`<div class="who">${esc(m.name)}</div><div class="txt">${esc(m.text)}</div><div class="t">${fmtTime(m.ts)}</div>`;
  box.appendChild(el); box.scrollTop=box.scrollHeight;
  if(!document.getElementById("chatPanel").classList.contains("on")) document.getElementById("chatFab").classList.add("unread");
}
function sendChat(text){
  const m={name:myName(),text:text,ts:Date.now()};
  if(CLOUD&&chatRef){ try{chatRef.push(m);}catch(e){toast("Chat send failed");} }
  else { localChat.push(m); try{localStorage.setItem(CHAT_KEY,JSON.stringify(localChat));}catch(e){} renderMsg(m); }
}
function initLocalChat(){
  try{localChat=JSON.parse(localStorage.getItem(CHAT_KEY))||[];}catch(e){localChat=[];}
  const box=document.getElementById("chatMsgs"); box.innerHTML="";
  if(localChat.length) localChat.forEach(renderMsg);
  else box.innerHTML=`<div class="chat-empty">No messages yet.</div>`;
  const b=document.getElementById("chatBanner");
  b.className="chat-banner";
  b.textContent="Messages are saved on this device only.";
}
document.getElementById("chatFab").onclick=()=>{
  const p=document.getElementById("chatPanel");p.classList.add("on");
  document.getElementById("chatFab").classList.remove("unread");
  document.getElementById("chatFab").style.display="none"; setWho();
  document.getElementById("chatInput").focus();
};
document.getElementById("chatClose").onclick=()=>{
  document.getElementById("chatPanel").classList.remove("on");
  document.getElementById("chatFab").style.display="";
};
document.getElementById("chatName").onclick=()=>{
  const cur=(function(){try{return localStorage.getItem("carpoolChatName")||"";}catch(e){return "";}})();
  const n=(prompt("Your name for the chat:",cur)||"").trim(); if(n){try{localStorage.setItem("carpoolChatName",n);}catch(e){} setWho();}
};
document.getElementById("chatForm").addEventListener("submit",e=>{
  e.preventDefault();const inp=document.getElementById("chatInput");const v=inp.value.trim();
  if(!v)return; sendChat(v); inp.value=""; setWho();
});

/* ============================================================
   BOOT
============================================================ */
document.getElementById("modeNote").innerHTML = CLOUD
  ? "Everything syncs live for everyone."
  : "Changes save in your browser automatically.";
document.getElementById("footer").innerHTML = CLOUD
  ? `Shared live board + group chat via Firebase. Use <strong>Export</strong> any time to save a copy of the assignments.`
  : `Single-page carpool board. It saves to <em>this</em> browser only — use <strong>Export</strong> to save or share a copy of the assignments.`;

initHistory();
render();
updateHistUI();
initLocalChat();
</script>
</body>
