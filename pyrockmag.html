<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyRockmag — Nick Anderson</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #000;
        }
        .tool-header h1 {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 1.1em;
            font-weight: normal;
        }
        .tool-header .subtitle {
            color: rgba(0, 0, 0, 0.7);
        }
        .tool-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .tool-actions a {
            font-size: 0.9em;
            padding: 0.35rem 0.7rem;
            border: 1px solid #000;
            color: #000;
            text-decoration: none;
            transition: all 0.15s;
        }
        .tool-actions a:hover {
            background: #000;
            color: #fff;
            text-transform: none;
        }
        .tool-iframe-container {
            width: 100%;
            height: calc(100vh - 50px);
            background: #0a0e0f;
        }
        .tool-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <main class="main-content" style="margin-right: 0; max-width: 100%; padding: 0;">
            <div class="tool-header">
                <h1>PYROCKMAG</h1>
                <div class="tool-actions">
                    <a href="pyrockmag_6.html" target="_blank">Open in new tab ↗</a>
                </div>
            </div>
            <div class="tool-iframe-container">
                <iframe src="pyrockmag_6.html"></iframe>
            </div>
        </main>
    </div>
</body>
</html>
